[package]
name = "replicant-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros"] }
vercel_runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[lib]
path = "src/lib.rs"

# One [[bin]] per Vercel Function. The file path under api/ becomes the route:
# api/webhook.rs -> https://<deployment>/api/webhook
[[bin]]
name = "webhook"
path = "api/webhook.rs"

[[bin]]
name = "events"
path = "api/events.rs"
