<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Replicant — Bloom Icon</title>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --t1: #e9eef7; --t2: #9aa6bc; --t3: #6a7488; --accent: #ffb23e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans); color: var(--t1); min-height: 100vh; padding: 48px 52px 72px;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(1100px 700px at 18% -10%, #1a1330, transparent 60%),
      radial-gradient(900px 700px at 100% 120%, #11202a, transparent 60%),
      #070a11;
  }
  .head { text-align: center; max-width: 620px; }
  .head h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
  .head p { font-size: 13.5px; line-height: 1.5; color: var(--t2); margin: 0; }
  .head .hint { font-size: 12px; color: var(--t3); margin-top: 10px; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: 44px; }
  .hero { filter: drop-shadow(0 26px 56px rgba(0,0,0,0.62)); display: block; }
  .readout { font-family: var(--mono); font-size: 11.5px; color: var(--t3); letter-spacing: 0.2px; }
  .readout b { color: var(--t2); font-weight: 600; }
  .sizes { display: flex; align-items: flex-end; gap: 22px; padding-top: 22px; justify-content: center; border-top: 1px solid rgba(255,255,255,0.08); }
  .sizes .s { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .sizes .s svg { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
  .sizes .s span { font-family: var(--mono); font-size: 9.5px; color: var(--t3); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const { useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakRadio, TweakColor } = window;

    // ── geometry ────────────────────────────────────────────────
    const R = 230; // squircle corner radius on the 1024 grid
    function hex(cx, cy, r) {
      let d = '';
      for (let i = 0; i < 6; i++) { const a = (-90 + i * 60) * Math.PI / 180; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1) + ' '; }
      return d + 'Z';
    }
    function uvec(f, t) { const dx = t[0] - f[0], dy = t[1] - f[1], L = Math.hypot(dx, dy) || 1; return [dx / L, dy / L]; }
    function roundedHex(cx, cy, Rc, k) {
      if (k <= 0.001) return hex(cx, cy, Rc);
      k = Math.min(k, 1);
      const V = [];
      for (let i = 0; i < 6; i++) { const a = (-90 + i * 60) * Math.PI / 180; V.push([cx + Rc * Math.cos(a), cy + Rc * Math.sin(a)]); }
      const d = k * (Rc / 2), rf = d * Math.tan(Math.PI / 3);
      const A = [], B = [];
      for (let i = 0; i < 6; i++) {
        const cur = V[i], prev = V[(i + 5) % 6], next = V[(i + 1) % 6];
        const up = uvec(cur, prev), un = uvec(cur, next);
        A.push([cur[0] + d * up[0], cur[1] + d * up[1]]);
        B.push([cur[0] + d * un[0], cur[1] + d * un[1]]);
      }
      let p = 'M ' + A[0][0].toFixed(1) + ' ' + A[0][1].toFixed(1) + ' ';
      for (let i = 0; i < 6; i++) {
        p += 'A ' + rf.toFixed(1) + ' ' + rf.toFixed(1) + ' 0 0 1 ' + B[i][0].toFixed(1) + ' ' + B[i][1].toFixed(1) + ' ';
        p += 'L ' + A[(i + 1) % 6][0].toFixed(1) + ' ' + A[(i + 1) % 6][1].toFixed(1) + ' ';
      }
      return p + 'Z';
    }

    // ── ring generator ──────────────────────────────────────────
    // Ring 0 is the sharp offspring/device ring (k=0, carries buds); the last
    // ring is a full circle (k=1) at the chosen outer placement. Spacing is
    // distributed by an easing exponent (>1 accelerates outward); corner
    // rounding ramps by the rounding exponent; opacity fades, width tapers.
    const INNER_R = 158;
    function genRings(t) {
      const n = Math.max(2, Math.round(t.ringCount));
      const outerR = t.outerPlacement, ease = t.spacingEase, gamma = t.rounding;
      const rings = [];
      for (let i = 0; i < n; i++) {
        const p = i / (n - 1);
        rings.push({
          Rc: INNER_R + (outerR - INNER_R) * Math.pow(p, ease),
          k: Math.pow(p, gamma),
          op: 0.05 + 0.5 * Math.pow(1 - p, 1.3),
          w: 7 - 2 * p,
          buds: i === 0,
        });
      }
      return rings;
    }

    const BG = {
      violet: ['#1b1733', '#08060f'],
      navy:   ['#122036', '#070b14'],
      void:   ['#15151c', '#050506'],
    };
    const VIOLET = [181, 139, 255];
    const toRgb = (h) => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
    const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
    const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

    // central device rendered as a faint isometric cube (hex radius 78).
    // Pointy-top hexagon split into three rhombus faces meeting at center:
    // top (lit), right (mid), left (shade); ridge = the two upper internal
    // edges, front = the lower vertical edge (in shadow).
    const CUBE = {
      top:   'M0 -78 L67.55 -39 L0 0 L-67.55 -39 Z',
      right: 'M67.55 -39 L67.55 39 L0 78 L0 0 Z',
      left:  'M-67.55 -39 L0 0 L0 78 L-67.55 39 Z',
      ridge: 'M-67.55 -39 L0 0 L67.55 -39',
      front: 'M0 0 L0 78',
    };

    function bloomSVG(t, size, idp) {
      const rings = genRings(t), n = rings.length;
      const glow = t.glow / 100, tint = t.relayTint / 100;
      const acc = toRgb(t.accent);
      const coreLight = rgb(mix(acc, [255, 255, 255], 0.55));
      const coreDark = rgb(mix(acc, [0, 0, 0], 0.5));
      const budFill = rgb(mix(acc, [255, 255, 255], 0.18));
      const [bg0, bg1] = BG[t.bg] || BG.violet;
      const ce = t.cubeContrast / 100, ee = t.cubeEdge / 100;
      const fL = (0.18 * ce).toFixed(3), fR = (0.06 * ce).toFixed(3), fT = (0.26 * ce).toFixed(3);
      const eR = (0.30 * ee).toFixed(3), eF = (0.32 * ee).toFixed(3);

      let body = '';
      for (let i = n - 1; i >= 0; i--) {
        const r = rings[i];
        const outerFrac = i / (n - 1);
        const c = mix(acc, VIOLET, tint * outerFrac);
        body += `<path d="${roundedHex(0, 0, r.Rc, r.k)}" fill="none" stroke="rgba(${c[0]},${c[1]},${c[2]},${r.op.toFixed(3)})" stroke-width="${r.w.toFixed(1)}" stroke-linejoin="round"/>`;
      }
      body += `<path d="${hex(0, 0, 78)}" fill="url(#core${idp})"/>`
        + `<path d="${CUBE.left}" fill="rgba(0,0,0,${fL})"/>`
        + `<path d="${CUBE.right}" fill="rgba(0,0,0,${fR})"/>`
        + `<path d="${CUBE.top}" fill="url(#cubeTop${idp})"/>`
        + `<path d="${CUBE.ridge}" fill="none" stroke="rgba(255,244,218,${eR})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<path d="${CUBE.front}" fill="none" stroke="rgba(42,21,0,${eF})" stroke-width="1.8" stroke-linecap="round"/>`;
      // offspring buds on ring 0 (always present)
      const halo = `rgba(${acc[0]},${acc[1]},${acc[2]},${(t.outlineOpacity / 100).toFixed(3)})`;
      for (let i = 0; i < 6; i++) {
        const a = (-90 + i * 60) * Math.PI / 180, x = (INNER_R * Math.cos(a)).toFixed(1), y = (INNER_R * Math.sin(a)).toFixed(1);
        body += `<circle cx="${x}" cy="${y}" r="${t.outlineRadius}" fill="${halo}"/><circle cx="${x}" cy="${y}" r="${t.budRadius}" fill="${budFill}"/>`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 1024 1024" class="${size >= 200 ? 'hero' : ''}" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg${idp}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg0}"/><stop offset="1" stop-color="${bg1}"/></linearGradient>
          <radialGradient id="core${idp}" cx="40%" cy="34%" r="72%"><stop offset="0" stop-color="${coreLight}"/><stop offset="58%" stop-color="${t.accent}"/><stop offset="100%" stop-color="${coreDark}"/></radialGradient>
          <radialGradient id="glow${idp}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(${acc[0]},${acc[1]},${acc[2]},0.5)"/><stop offset="100%" stop-color="rgba(${acc[0]},${acc[1]},${acc[2]},0)"/></radialGradient>
          <linearGradient id="cubeTop${idp}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,243,216,${fT})"/><stop offset="1" stop-color="rgba(255,243,216,0)"/></linearGradient>
          <clipPath id="clip${idp}"><rect width="1024" height="1024" rx="${R}"/></clipPath>
        </defs>
        <rect width="1024" height="1024" rx="${R}" fill="url(#bg${idp})"/>
        <g clip-path="url(#clip${idp})"><g transform="translate(512,512)">
          <circle r="${(330 * (0.7 + glow * 0.3)).toFixed(0)}" fill="url(#glow${idp})" opacity="${(0.7 * glow).toFixed(2)}"/>
          ${body}
        </g></g>
      </svg>`;
    }

    function Icon({ t, size, idp }) {
      return <div dangerouslySetInnerHTML={{ __html: bloomSVG(t, size, idp) }} />;
    }

    const SMALL = [64, 32, 16];

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#ffb23e",
      "relayTint": 20,
      "bg": "violet",
      "ringCount": 7,
      "spacingEase": 2.2,
      "outerPlacement": 650,
      "rounding": 0.75,
      "glow": 110,
      "budRadius": 13,
      "outlineRadius": 24,
      "outlineOpacity": 30,
      "cubeContrast": 85,
      "cubeEdge": 35
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div className="head">
            <h1>Replicant · Bloom</h1>
            <p>The device hex replicating outward — offspring budding at the first ring, waves spaced progressively further apart while corners round and edges hold, until the outer wave is a full circle bleeding off the frame: the FTL relay.</p>
            <div className="hint">Open <b style={{ color: 'var(--t2)' }}>Tweaks</b> (toolbar) to shape the rings, color, and buds.</div>
          </div>

          <div className="stage">
            <Icon t={t} size={300} idp="hero" />
            <div className="readout">
              <b>{Math.round(t.ringCount)}</b> rings · ease <b>{t.spacingEase.toFixed(1)}</b> · outer <b>{Math.round(t.outerPlacement)}</b> · round <b>{t.rounding.toFixed(2)}</b>
            </div>
            <div className="sizes">
              {SMALL.map((s) => (
                <div key={s} className="s"><Icon t={t} size={s} idp={'s' + s} /><span>{s}px</span></div>
              ))}
            </div>
          </div>

          <TweaksPanel>
            <TweakSection label="Color" />
            <TweakColor label="Accent" value={t.accent}
              options={['#ffb23e', '#ff9e2c', '#ff7e3e', '#ffce6a']}
              onChange={(v) => setTweak('accent', v)} />
            <TweakSlider label="Relay tint (outer rings)" value={t.relayTint} min={0} max={100} step={5} unit="%"
              onChange={(v) => setTweak('relayTint', v)} />
            <TweakRadio label="Background" value={t.bg}
              options={['violet', 'navy', 'void']}
              onChange={(v) => setTweak('bg', v)} />

            <TweakSection label="Rings" />
            <TweakSlider label="Number of rings" value={t.ringCount} min={5} max={10} step={1}
              onChange={(v) => setTweak('ringCount', v)} />
            <TweakSlider label="Spacing easing" value={t.spacingEase} min={0.7} max={3} step={0.1}
              onChange={(v) => setTweak('spacingEase', v)} />
            <TweakSlider label="Outermost ring" value={t.outerPlacement} min={560} max={780} step={10}
              onChange={(v) => setTweak('outerPlacement', v)} />
            <TweakSlider label="Corner rounding" value={t.rounding} min={0.5} max={2} step={0.05}
              onChange={(v) => setTweak('rounding', v)} />
            <TweakSlider label="Glow" value={t.glow} min={0} max={160} step={5} unit="%"
              onChange={(v) => setTweak('glow', v)} />

            <TweakSection label="Center cube" />
            <TweakSlider label="Face contrast" value={t.cubeContrast} min={0} max={150} step={5} unit="%"
              onChange={(v) => setTweak('cubeContrast', v)} />
            <TweakSlider label="Edge opacity" value={t.cubeEdge} min={0} max={100} step={5} unit="%"
              onChange={(v) => setTweak('cubeEdge', v)} />

            <TweakSection label="Offspring buds" />
            <TweakSlider label="Bud radius" value={t.budRadius} min={4} max={40} step={1}
              onChange={(v) => setTweak('budRadius', v)} />
            <TweakSlider label="Bud outline radius" value={t.outlineRadius} min={10} max={80} step={1}
              onChange={(v) => setTweak('outlineRadius', v)} />
            <TweakSlider label="Bud outline opacity" value={t.outlineOpacity} min={0} max={60} step={2} unit="%"
              onChange={(v) => setTweak('outlineOpacity', v)} />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
