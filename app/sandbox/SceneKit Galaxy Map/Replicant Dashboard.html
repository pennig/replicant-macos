<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Replicant — Dashboard Directions</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0e16; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(255,178,62,0.3); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="DirectionA.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DirectionA } = window;

    // Each artboard is a slice of "space" with the app window floating on it.
    function Frame({ dark, children }) {
      return (
        <div style={{
          width: '100%', height: '100%',
          background: dark
            ? 'radial-gradient(1300px 820px at 32% 16%, #121a2e, #080b13 72%)'
            : 'radial-gradient(1300px 820px at 32% 16%, #efe9df, #ddd5c8 78%)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          {children}
        </div>
      );
    }

    const W = 1380, H = 904;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="dash2" title="Replicant · Devices & Inspector"
            subtitle="Direction A (Instrument), refined per feedback — replicant switcher + XP, account in the footer, location map, parameterized commands. Shown in dark and light. Click any device or command.">
            <DCArtboard id="dark" label="A · Instrument — Dark" width={W} height={H} style={{ background: '#080b13' }}>
              <Frame dark><DirectionA theme="dark" /></Frame>
            </DCArtboard>
            <DCArtboard id="light" label="A · Instrument — Light" width={W} height={H} style={{ background: '#ddd5c8' }}>
              <Frame><DirectionA theme="light" /></Frame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
