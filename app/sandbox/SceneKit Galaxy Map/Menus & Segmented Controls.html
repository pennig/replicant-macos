<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Replicant — Menus &amp; Segmented Controls (live)</title>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); background: #06090f; color: #e9eef7; min-height: 100vh; padding: 0 0 64px; }

  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px);
    background: rgba(8,11,18,0.82); border-bottom: 0.5px solid rgba(255,255,255,0.1);
    padding: 16px 40px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .bar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  .bar .sub { font-size: 12px; color: #9aa6bc; margin: 2px 0 0; }
  .bar .hint { font-size: 11.5px; color: #6a7488; margin-left: auto; max-width: 430px; line-height: 1.5; }
  .bar .hint b { color: #ffb23e; font-weight: 600; }

  .cols { max-width: 1180px; margin: 30px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 0 24px; }

  .panel { border-radius: 16px; padding: 26px 26px 34px; overflow: visible; background: var(--content);
    box-shadow: 0 0 0 0.5px var(--line), 0 30px 80px rgba(0,0,0,0.4); color: var(--t1); }
  .panel[data-theme="dark"] {
    --content: #0a1019; --raised: #12161f; --secTint: rgba(255,255,255,0.085);
    --line: rgba(255,255,255,0.085); --lineSoft: rgba(255,255,255,0.05); --lineStrong: rgba(255,255,255,0.16);
    --t1: #e9eef7; --t2: #9aa6bc; --t3: #6a7488;
    --accent: #ffb23e; --accentMuted: rgba(255,178,62,0.14); --accentBorder: rgba(255,178,62,0.34);
    --fieldBg: rgba(255,255,255,0.05); --secHover: rgba(255,255,255,0.05); --panel2: rgba(255,255,255,0.05);
    --trackBg: rgba(255,255,255,0.055); --thumbBg: #2b323e; --thumbShadow: 0 1px 2px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.35); }
  .panel[data-theme="light"] {
    --content: #f9f5ee; --raised: #f2eee7; --secTint: #e4dccd;
    --line: rgba(28,34,48,0.12); --lineSoft: rgba(28,34,48,0.07); --lineStrong: rgba(28,34,48,0.22);
    --t1: #1b2230; --t2: #5a6478; --t3: #929bad;
    --accent: #d19317; --accentMuted: rgba(207,132,24,0.14); --accentBorder: rgba(209,147,23,0.45);
    --fieldBg: #ffffff; --secHover: rgba(28,34,48,0.04); --panel2: rgba(28,34,48,0.05);
    --trackBg: rgba(28,34,48,0.06); --thumbBg: #ffffff; --thumbShadow: 0 1px 2px rgba(28,34,48,0.16), 0 3px 8px rgba(28,34,48,0.12); }

  .scheme-tag { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--t3); margin-bottom: 22px; }
  .group-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--t3); opacity: 0.85; margin: 30px 0 16px; }
  .group-label:first-of-type { margin-top: 0; }

  .variant { margin-bottom: 24px; }
  .variant-name { display: flex; align-items: baseline; gap: 9px; margin-bottom: 11px; flex-wrap: wrap; }
  .variant-name b { font-size: 13px; font-weight: 600; color: var(--t1); }
  .variant-name span { font-family: var(--mono); font-size: 10.5px; color: var(--t3); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

  /* ── segmented control ── */
  .seg2 { position: relative; display: inline-flex; gap: 0; padding: 3px; border-radius: 9px; isolation: isolate; }
  .seg2.track { background: var(--trackBg); box-shadow: inset 0 0 0 0.5px var(--line); }
  .seg2.tinted { background: transparent; box-shadow: inset 0 0 0 1px var(--lineStrong); padding: 2px; }
  .seg2 button { position: relative; z-index: 1; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--t2); background: none; border: none; cursor: pointer; padding: 6px 15px; border-radius: 7px; line-height: 1;
    white-space: nowrap; transition: color .14s ease; -webkit-tap-highlight-color: transparent; }
  .seg2 button:not([aria-pressed="true"]):hover { color: var(--t1); }
  .seg2:focus-within { box-shadow: inset 0 0 0 0.5px var(--line), 0 0 0 3px var(--accentBorder); }
  .seg2.tinted:focus-within { box-shadow: inset 0 0 0 1px var(--lineStrong), 0 0 0 3px var(--accentBorder); }
  .seg2.tinted button + button::before { content: ""; position: absolute; left: -0.5px; top: 22%; bottom: 22%; width: 1px; background: var(--lineSoft); }
  .seg2.tinted button[aria-pressed="true"]::before,
  .seg2.tinted button[aria-pressed="true"] + button::before { background: transparent; }
  .seg2.track .thumb { position: absolute; z-index: 0; top: 3px; height: calc(100% - 6px); border-radius: 7px;
    background: var(--thumbBg); box-shadow: var(--thumbShadow), inset 0 0 0 0.5px var(--lineSoft);
    transition: left .26s cubic-bezier(.32,.72,0,1), width .26s cubic-bezier(.32,.72,0,1); }
  .seg2.track button[aria-pressed="true"] { color: var(--t1); }
  .seg2.tinted button[aria-pressed="true"] { background: var(--accentMuted); color: var(--accent); }
  .pick { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--accent);
    padding: 3px 8px; border-radius: 20px; background: var(--accentMuted); }

  /* ── dropdown trigger A — value select (field, à la destination picker) ── */
  .fsel { display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 11px 0 12px; border-radius: 9px;
    min-width: 214px; background: var(--fieldBg); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
    transition: box-shadow .12s ease; -webkit-tap-highlight-color: transparent; }
  .fsel .lead { color: var(--t3); display: flex; flex-shrink: 0; }
  .fsel .lead svg { width: 15px; height: 15px; }
  .fsel .val { flex: 1; font-family: var(--mono); font-size: 13px; color: var(--t1); }
  .fsel .chev { color: var(--t2); display: flex; flex-shrink: 0; transition: transform .16s ease; }
  .fsel .chev svg { width: 12px; height: 12px; }
  .fsel:hover { box-shadow: inset 0 0 0 1px var(--lineStrong); }
  .fsel[aria-expanded="true"] { box-shadow: inset 0 0 0 1.5px var(--accentBorder); }
  .fsel[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* ── dropdown trigger B — entity switcher (rich, à la replicant switcher) ── */
  .swit { display: inline-flex; align-items: center; gap: 10px; padding: 8px 11px 8px 10px; border-radius: 11px;
    min-width: 248px; text-align: left; background: var(--raised); box-shadow: inset 0 0 0 0.5px var(--line); cursor: pointer;
    transition: box-shadow .12s ease; -webkit-tap-highlight-color: transparent; }
  .swit .chip { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--accentMuted); box-shadow: inset 0 0 0 0.5px var(--accentBorder); color: var(--accent); }
  .swit .chip svg { width: 17px; height: 17px; }
  .swit .body { flex: 1; min-width: 0; }
  .swit .body .t { display: block; font-size: 14px; font-weight: 700; color: var(--t1); letter-spacing: -0.2px; }
  .swit .body .s { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--t3); margin-top: 1px; }
  .swit .chev { color: var(--t2); display: flex; flex-shrink: 0; transition: transform .16s ease; }
  .swit .chev svg { width: 12px; height: 12px; }
  .swit:hover { box-shadow: inset 0 0 0 0.5px var(--lineStrong); }
  .swit[aria-expanded="true"] { box-shadow: inset 0 0 0 1px var(--accentBorder); }
  .swit[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .note { font-size: 11.5px; color: var(--t3); margin-top: 11px; line-height: 1.5; max-width: 440px; }
  .note b { color: var(--accent); font-weight: 600; }

  /* ── floating menu — solid raised surface, lifted from the dashboard ── */
  .menu { position: fixed; z-index: 100; padding: 5px; border-radius: 11px; transform-origin: top left;
    opacity: 0; transform: scale(0.97) translateY(-4px); pointer-events: none;
    transition: opacity .13s ease, transform .13s cubic-bezier(.32,.72,0,1); }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu[data-theme="dark"] { background: #161d2c; box-shadow: 0 16px 44px rgba(0,0,0,0.55), inset 0 0 0 0.5px rgba(255,255,255,0.1);
    --mt1: #e9eef7; --mt3: #6a7488; --macc: #ffb23e; --msel: rgba(255,178,62,0.14); --msoft: rgba(255,255,255,0.05);
    --msep: rgba(255,255,255,0.08); --mchip: rgba(255,255,255,0.05); }
  .menu[data-theme="light"] { background: #ffffff; box-shadow: 0 16px 44px rgba(28,34,48,0.18), inset 0 0 0 0.5px rgba(28,34,48,0.1);
    --mt1: #1b2230; --mt3: #929bad; --macc: #d19317; --msel: rgba(207,132,24,0.14); --msoft: rgba(28,34,48,0.04);
    --msep: rgba(28,34,48,0.08); --mchip: rgba(28,34,48,0.05); }

  /* simple item (value select) */
  .mi { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: none; background: none;
    border-radius: 7px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; color: var(--mt1); text-align: left; line-height: 1.2; }
  .mi .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mt3); flex-shrink: 0; }
  .mi:hover { background: var(--msoft); }
  .mi[aria-selected="true"] { background: var(--msel); }
  .mi[aria-selected="true"] .dot { background: var(--macc); }

  /* rich item (entity switcher) */
  .mir { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 9px; border: none; background: none;
    border-radius: 7px; cursor: pointer; text-align: left; font-family: var(--sans); }
  .mir .chip { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--mchip); color: var(--mt3); }
  .mir .chip svg { width: 14px; height: 14px; }
  .mir .body { flex: 1; min-width: 0; }
  .mir .body .t { display: block; font-size: 12.5px; font-weight: 600; color: var(--mt1); }
  .mir .body .s { display: block; font-family: var(--mono); font-size: 10px; color: var(--mt3); margin-top: 1px; }
  .mir .meta { text-align: right; flex-shrink: 0; }
  .mir .meta .lv { display: block; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--mt1); opacity: 0.75; }
  .mir .meta .dv { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--mt3); }
  .mir:hover { background: var(--msoft); }
  .mir[aria-selected="true"] { background: var(--msel); }
  .mir[aria-selected="true"] .chip { color: var(--macc); }

  .menu-foot { border-top: 1px solid var(--msep); margin: 5px 4px 4px; padding-top: 4px; }
  .menu-foot button { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 9px; border-radius: 7px; border: none;
    background: none; cursor: pointer; color: var(--mt3); font-family: var(--sans); font-size: 12px; font-weight: 500; }
  .menu-foot button .plus { font-size: 14px; line-height: 1; }
  .menu-foot button:hover { background: var(--msoft); color: var(--mt1); }
</style>
</head>
<body>
  <div class="bar">
    <div>
      <h1>Menus &amp; segmented controls — live</h1>
      <p class="sub">Two options each. Tap segments, click triggers to open menus — both themes are interactive.</p>
    </div>
    <p class="hint">Dropdowns now lift directly from the dashboard's <b>destination picker</b> and <b>replicant switcher</b> — single rotating chevron, solid raised menu, accent-tinted selection.</p>
  </div>

  <div class="cols" id="cols"></div>

<script>
  const chevDown = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5l4 4 4-4"/></svg>';
  const pin   = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.6c-2.1 0-3.8 1.6-3.8 3.7C3.2 8.1 7 12.4 7 12.4s3.8-4.3 3.8-7.1C10.8 3.2 9.1 1.6 7 1.6z"/><circle cx="7" cy="5.2" r="1.35"/></svg>';
  const orbit = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="1.7" fill="currentColor" stroke="none"/><circle cx="15.3" cy="9" r="1.25" fill="currentColor" stroke="none"/></svg>';

  const LOCATIONS = ['Tharsis Forge', 'Elysium Shelf', 'Olympus Rim', 'Hellas Basin', 'Valles Relay'];
  const REPLICANTS = [
    { n: 'Roy',   id: 'B58FCC78', loc: 'Tharsis Forge', lv: 14, dev: 23 },
    { n: 'Pris',  id: 'A21D90F3', loc: 'Elysium Shelf', lv: 9,  dev: 11 },
    { n: 'Zhora', id: 'C77E1A2B', loc: 'Olympus Rim',   lv: 11, dev: 17 },
    { n: 'Leon',  id: 'D40B5E91', loc: 'Hellas Basin',  lv: 7,  dev: 6  },
  ];

  function segBlock() {
    return `<div class="group-label">Segmented controls</div>

      <div class="variant">
        <div class="variant-name"><b>Option A — Sliding glass thumb</b><span>SurfaceRaised thumb · recessed track</span><span class="pick">Selected</span></div>
        <div class="row">
          <div class="seg2 track" role="group" aria-label="View">
            <button aria-pressed="true">Grid</button><button>List</button><button>Map</button>
            <span class="thumb"></span>
          </div>
          <div class="seg2 track" role="group" aria-label="Range">
            <button aria-pressed="true">Live</button><button>24h</button>
            <span class="thumb"></span>
          </div>
        </div>
        <div class="note">iOS / Liquid&nbsp;Glass standard. The thumb floats above a recessed track and slides between segments.</div>
      </div>

      <div class="variant">
        <div class="variant-name"><b>Option B — Accent-tinted</b><span>AccentMuted fill · AccentPrimary label</span></div>
        <div class="row">
          <div class="seg2 tinted" role="group" aria-label="View">
            <button aria-pressed="true">Grid</button><button>List</button><button>Map</button>
          </div>
          <div class="seg2 tinted" role="group" aria-label="Range">
            <button aria-pressed="true">Live</button><button>24h</button>
          </div>
        </div>
        <div class="note">Flatter, hairline-framed; selection borrows the brand <b>AccentMuted</b> tint. Kept for dense inline toolbars.</div>
      </div>`;
  }

  function menuBlock() {
    return `<div class="group-label">Dropdown menus</div>

      <div class="variant">
        <div class="variant-name"><b>Option A — Value select</b><span>field · destination-picker pattern</span></div>
        <div class="row">
          <button class="fsel" aria-haspopup="listbox" aria-expanded="false" data-kind="loc" data-sel="1">
            <span class="lead">${pin}</span>
            <span class="val">Elysium Shelf</span>
            <span class="chev">${chevDown}</span>
          </button>
        </div>
        <div class="note">The dashboard's <b>Set destination</b> field. Leading glyph, mono value, one rotating chevron; the menu marks the current row with an accent dot + tint. For picking one value from a list.</div>
      </div>

      <div class="variant">
        <div class="variant-name"><b>Option B — Entity switcher</b><span>rich · replicant-switcher pattern</span></div>
        <div class="row">
          <button class="swit" aria-haspopup="listbox" aria-expanded="false" data-kind="rep" data-sel="0">
            <span class="chip">${orbit}</span>
            <span class="body"><span class="t">Roy</span><span class="s">B58FCC78</span></span>
            <span class="chev">${chevDown}</span>
          </button>
        </div>
        <div class="note">The <b>active-replicant switcher</b>. A taller trigger showing an avatar chip + two-line identity; the menu rows carry icon, name/id and right-aligned stats, plus a footer action. For switching between rich entities.</div>
      </div>`;
  }

  function panel(theme) {
    return `<div class="panel" data-theme="${theme}">
      <div class="scheme-tag">${theme.toUpperCase()}</div>
      ${segBlock()}${menuBlock()}</div>`;
  }

  document.getElementById('cols').innerHTML = panel('dark') + panel('light');

  /* ── segmented: sliding thumb ── */
  function positionThumb(seg) {
    const thumb = seg.querySelector('.thumb'); if (!thumb) return;
    const sel = seg.querySelector('button[aria-pressed="true"]'); if (!sel) return;
    thumb.style.left = sel.offsetLeft + 'px';
    thumb.style.width = sel.offsetWidth + 'px';
  }
  document.querySelectorAll('.seg2').forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      positionThumb(seg);
    });
  });
  function positionAll() { document.querySelectorAll('.seg2.track').forEach(positionThumb); }
  positionAll();
  requestAnimationFrame(positionAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionAll);
  window.addEventListener('resize', positionAll);

  /* ── dropdown menus ── */
  let openState = null;

  function closeMenu() {
    if (!openState) return;
    const { menu, trigger } = openState;
    menu.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
    setTimeout(() => menu.remove(), 150);
    openState = null;
  }

  function buildMenu(trigger, theme) {
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.dataset.theme = theme;
    menu.setAttribute('role', 'listbox');
    const kind = trigger.dataset.kind;
    const sel = +trigger.dataset.sel;

    if (kind === 'loc') {
      menu.innerHTML = LOCATIONS.map((o, i) =>
        `<button class="mi" role="option" aria-selected="${i === sel}" data-i="${i}">
           <span class="dot"></span><span>${o}</span></button>`).join('');
    } else {
      menu.innerHTML = REPLICANTS.map((r, i) =>
        `<button class="mir" role="option" aria-selected="${i === sel}" data-i="${i}">
           <span class="chip">${orbit}</span>
           <span class="body"><span class="t">${r.n}</span><span class="s">${r.loc}</span></span>
           <span class="meta"><span class="lv">Lv ${r.lv}</span><span class="dv">${r.dev} dev</span></span>
         </button>`).join('') +
        `<div class="menu-foot"><button data-i="-1"><span class="plus">+</span> Commission new replicant</button></div>`;
    }
    return menu;
  }

  function openMenu(trigger) {
    closeMenu();
    const theme = trigger.closest('.panel').dataset.theme;
    const menu = buildMenu(trigger, theme);
    document.body.appendChild(menu);

    const r = trigger.getBoundingClientRect();
    menu.style.minWidth = r.width + 'px';
    const mw = Math.max(menu.offsetWidth, r.width);
    let left = r.left;
    if (left + mw > window.innerWidth - 8) left = window.innerWidth - 8 - mw;
    let top = r.bottom + 6;
    if (top + menu.offsetHeight > window.innerHeight - 8) top = r.top - 6 - menu.offsetHeight;
    menu.style.left = Math.max(8, left) + 'px';
    menu.style.top = Math.max(8, top) + 'px';

    requestAnimationFrame(() => menu.classList.add('open'));
    trigger.setAttribute('aria-expanded', 'true');
    openState = { menu, trigger };

    menu.addEventListener('click', e => {
      const it = e.target.closest('[data-i]'); if (!it) return;
      const i = +it.dataset.i;
      if (i >= 0) {
        trigger.dataset.sel = i;
        if (trigger.dataset.kind === 'loc') {
          trigger.querySelector('.val').textContent = LOCATIONS[i];
        } else {
          const r2 = REPLICANTS[i];
          trigger.querySelector('.body .t').textContent = r2.n;
          trigger.querySelector('.body .s').textContent = r2.id;
        }
      }
      closeMenu();
    });
  }

  document.querySelectorAll('.fsel, .swit').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      if (openState && openState.trigger === t) { closeMenu(); return; }
      openMenu(t);
    });
  });

  document.addEventListener('click', e => { if (openState && !openState.menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('scroll', closeMenu, true);
  window.addEventListener('resize', closeMenu);
</script>
</body>
</html>
