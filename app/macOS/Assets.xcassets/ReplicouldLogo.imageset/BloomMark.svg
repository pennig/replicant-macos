<svg width="500" height="500" viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="210">
      <stop offset="0" stop-color="rgba(255,178,62,0.45)"/>
      <stop offset="1" stop-color="rgba(255,178,62,0)"/>
    </radialGradient>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="-16" cy="-22" r="110" fx="-16" fy="-22">
      <stop offset="0" stop-color="rgb(255,220,168)"/>
      <stop offset="0.5" stop-color="rgb(255,178,62)"/>
      <stop offset="1" stop-color="rgb(128,89,31)"/>
    </radialGradient>
    <linearGradient id="cubeTop" gradientUnits="userSpaceOnUse" x1="0" y1="-78" x2="0" y2="0">
      <stop offset="0" stop-color="rgba(255,243,216,0.117)"/>
      <stop offset="1" stop-color="rgba(255,243,216,0)"/>
    </linearGradient>
  </defs>

  <!-- soft amber glow -->
  <circle cx="0" cy="0" r="210" fill="url(#glow)"/>

  <!-- ring 1 (rounded) then ring 0 (sharp, carries buds) -->
  <path d="M -96.99 -168.00 L -16.88 -214.26 A 33.75 33.75 0 0 1 16.88 -214.26 L 177.11 -121.74 A 33.75 33.75 0 0 1 193.99 -92.51 L 193.99 92.51 A 33.75 33.75 0 0 1 177.11 121.74 L 16.88 214.26 A 33.75 33.75 0 0 1 -16.88 214.26 L -177.11 121.74 A 33.75 33.75 0 0 1 -193.99 92.51 L -193.99 -92.51 A 33.75 33.75 0 0 1 -177.11 -121.74 Z"
        fill="none" stroke="rgba(255,178,62,0.422)" stroke-width="6.6" stroke-linejoin="round"/>
  <path d="M 0 -158 L 136.83 -79 L 136.83 79 L 0 158 L -136.83 79 L -136.83 -79 Z"
        fill="none" stroke="rgba(255,178,62,0.55)" stroke-width="7" stroke-linejoin="round"/>

  <!-- core cube — base hex with a lit radial fill -->
  <path d="M 0 -78 L 67.55 -39 L 67.55 39 L 0 78 L -67.55 39 L -67.55 -39 Z" fill="url(#core)"/>

  <!-- three isometric faces -->
  <path d="M -67.55 -39 L 0 0 L 0 78 L -67.55 39 Z" fill="rgba(0,0,0,0.081)"/>
  <path d="M 67.55 -39 L 67.55 39 L 0 78 L 0 0 Z" fill="rgba(0,0,0,0.027)"/>
  <path d="M 0 -78 L 67.55 -39 L 0 0 L -67.55 -39 Z" fill="url(#cubeTop)"/>

  <!-- interior edges -->
  <path d="M -67.55 -39 L 0 0 L 67.55 -39" fill="none" stroke="rgba(255,244,218,0.045)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 0 0 L 0 78" fill="none" stroke="rgba(42,21,0,0.048)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- offspring buds (halo + dot) at the six ring-0 vertices -->
  <g>
    <circle cx="0" cy="-158" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="0" cy="-158" r="13" fill="rgb(255,192,97)"/>
    <circle cx="136.83" cy="-79" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="136.83" cy="-79" r="13" fill="rgb(255,192,97)"/>
    <circle cx="136.83" cy="79" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="136.83" cy="79" r="13" fill="rgb(255,192,97)"/>
    <circle cx="0" cy="158" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="0" cy="158" r="13" fill="rgb(255,192,97)"/>
    <circle cx="-136.83" cy="79" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="-136.83" cy="79" r="13" fill="rgb(255,192,97)"/>
    <circle cx="-136.83" cy="-79" r="24" fill="rgba(255,178,62,0.30)"/>
    <circle cx="-136.83" cy="-79" r="13" fill="rgb(255,192,97)"/>
  </g>
</svg>
